<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>LIFF Diag4</title></head>
<body>
<pre id="out">loading...</pre>
<script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
function log(x) {
  document.getElementById('out').textContent = JSON.stringify(x, null, 2);
}
try {
  Object.keys(localStorage).filter(function(k){ return k.indexOf('LIFF_STORE') === 0; }).forEach(function(k){ localStorage.removeItem(k); });
} catch (e) {}
var API_URL = 'https://script.google.com/macros/s/AKfycby_d8CbhHDwuHblWqkVnzvVUyzlN4g3bxHoKcnj5Fm_IrpoiEIczcxETIkx6j9dUU7d/exec';
liff.init({ liffId: '2011596460-mh4XTnWc' }).then(function () {
  log({ step: 'init-ok', isInClient: liff.isInClient(), isLoggedIn: liff.isLoggedIn(), href: location.href });
  return fetch(API_URL + '?action=services').then(function(r){ return r.json(); });
}).then(function (data) {
  log({ step: 'fetch-ok', servicesCount: (data.services||[]).length, href: location.href });
}).catch(function (err) {
  log({ step: 'error', error: String(err), stack: err && err.stack, href: location.href });
});
</script>
</body>
</html>
